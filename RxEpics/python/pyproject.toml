[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxepics"
version = "0.1.0"
description = "Reactive streams for EPICS Channel Access"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "caproto[asyncio]>=1.0",
    "reactivex>=4.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/scientific-software-hub/rx-controls-suite"

[tool.hatch.build.targets.wheel]
packages = ["src/rxepics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: spawns a real caproto IOC subprocess (slow, ~60s; run with -m integration)",
]
addopts = "-m 'not integration'"
