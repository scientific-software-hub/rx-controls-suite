# Prefect server — UI + API for the tomography-scan flow.
#
# Run this alongside the synchrotron-beamline stack (see
# ../synchrotron-beamline/docker-compose.yml — start that one too):
#
#   docker compose up -d
#   export PREFECT_API_URL=http://127.0.0.1:4200/api
#   python prefect_flow.py
#   # open http://127.0.0.1:4200

services:
  prefect-server:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    volumes:
      - prefect-data:/root/.prefect

volumes:
  prefect-data:
