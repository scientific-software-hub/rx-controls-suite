<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guarded Tomography Scan — n8n</title>
<style>
  :root {
    --bg:#0e1417; --panel:#141d21; --panel2:#1a262b; --line:#26383f;
    --ink:#dfeef0; --dim:#8fa9ae; --teal:#5fd0c5; --teal-dk:#2b6f6a;
    --ok:#5fd0a8; --low:#e6b35c; --bad:#e07a6b; --re:#7fb7ff; --none:#22333a;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
         font-size:14px; line-height:1.45; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:15px; font-weight:600; letter-spacing:.04em; margin:0;
              text-transform:uppercase; color:var(--teal); }
  header .sub { color:var(--dim); font-size:12px; }
  .wrap { padding:20px; display:grid; gap:16px; max-width:1080px;
          grid-template-columns:repeat(3,1fr); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:14px 16px; }
  .panel.wide { grid-column:1 / -1; }
  .panel h2 { margin:0 0 10px; font-size:11px; font-weight:600; letter-spacing:.08em;
              text-transform:uppercase; color:var(--dim); }
  .row { display:flex; justify-content:space-between; padding:3px 0;
         border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--dim); }
  .row .v { font-family:var(--mono); }
  .big { font-family:var(--mono); font-size:28px; color:var(--teal); }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px;
          font-family:var(--mono); border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:var(--teal-dk); }
  .pill.warn { color:var(--low); border-color:#5b4a2c; }
  .pill.bad { color:var(--bad); border-color:#5b3330; }
  .strip { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
  .tick { width:14px; height:22px; border-radius:3px; background:var(--none); }
  .tick.s1 { background:var(--ok); }
  .tick.s2 { background:var(--low); }
  .tick.s3 { background:var(--re); }
  .legend { display:flex; gap:14px; margin-top:10px; color:var(--dim); font-size:12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px;
              margin-right:5px; vertical-align:middle; }
  .bar { height:8px; background:var(--panel2); border-radius:999px; overflow:hidden;
         margin-top:6px; }
  .bar > span { display:block; height:100%; background:var(--teal); width:0; transition:width .4s; }
  .bar .target { position:relative; }
  #log { grid-column:1 / -1; background:var(--panel); border:1px solid var(--line);
         border-radius:8px; padding:12px 14px; font-family:var(--mono); font-size:12px;
         height:190px; overflow-y:auto; color:var(--dim); }
  #log div { padding:1px 0; }
  #log .frame-ok { color:var(--ink); }
  #log .frame-low { color:var(--low); }
  #log .beam { color:var(--re); }
  #log .interlock, #log .aborted { color:var(--bad); }
  #log .finalized { color:var(--teal); }
  .stale { opacity:.45; }
</style>
</head>
<body>
<header>
  <h1>Guarded Tomography Scan</h1>
  <span class="sub">orchestrated by n8n · <span id="conn">connecting…</span></span>
</header>

<div class="wrap">
  <div class="panel">
    <h2>Loop</h2>
    <div class="row"><span class="k">phase</span><span class="v" id="phase">—</span></div>
    <div class="row"><span class="k">iteration</span><span class="v" id="iter">—</span></div>
    <div class="row"><span class="k">sweep</span><span class="v" id="sweep">—</span></div>
    <div class="row"><span class="k">status</span><span class="v" id="loopstatus">—</span></div>
    <div class="row"><span class="k">reason</span><span class="v" id="reason" style="max-width:60%;text-align:right">—</span></div>
  </div>

  <div class="panel">
    <h2>Quality</h2>
    <div class="big"><span id="qpct">—</span><span style="font-size:14px;color:var(--dim)">%</span></div>
    <div class="bar"><span id="qbar"></span></div>
    <div class="row" style="margin-top:8px"><span class="k">target</span><span class="v" id="qtarget">—</span></div>
    <div class="row"><span class="k">OK / LOW</span><span class="v" id="qok">—</span></div>
    <div class="row"><span class="k">acquired</span><span class="v" id="qacq">—</span></div>
  </div>

  <div class="panel">
    <h2>Machine</h2>
    <div class="row"><span class="k">beam</span><span class="v" id="beam">—</span></div>
    <div class="row"><span class="k">current</span><span class="v" id="cur">—</span></div>
    <div class="row"><span class="k">interlocks</span><span class="v" id="ilk">—</span></div>
    <div class="row"><span class="k">orbit x</span><span class="v" id="orb">—</span></div>
    <div class="row"><span class="k">scenario</span><span class="v" id="scn">—</span></div>
    <div class="row"><span class="k">shutter</span><span class="v" id="sht">—</span></div>
  </div>

  <div class="panel wide">
    <h2>Projection coverage — 0° … 180°</h2>
    <div class="strip" id="strip"></div>
    <div class="legend">
      <span><i style="background:var(--none)"></i>not acquired</span>
      <span><i style="background:var(--ok)"></i>OK</span>
      <span><i style="background:var(--low)"></i>LOW</span>
      <span><i style="background:var(--re)"></i>re-acquired OK</span>
    </div>
  </div>

  <div id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);

async function poll() {
  try {
    const r = await fetch('/state'); const s = await r.json();
    const m = s.machine || {};
    document.querySelector('.wrap').classList.toggle('stale', !!m.stale);

    $('beam').innerHTML = m.beam_ok === null ? '—'
      : `<span class="pill ${m.beam_ok ? 'ok':'bad'}">${m.beam_ok ? 'OK':'LOW'}</span>`;
    $('cur').textContent = m.current == null ? '—' : m.current.toFixed(1) + ' mA';
    $('ilk').textContent = m.interlocks == null ? '—' : m.interlocks;
    $('orb').textContent = m.orbit_x == null ? '—' : (m.orbit_x > 0 ? '+' : '') + m.orbit_x + ' µm';
    $('scn').textContent = m.scenario_name || '—';
    $('sht').textContent = m.shutter == null ? '—' : (m.shutter ? 'open' : 'closed');

    const sc = s.scan;
    if (!sc) {
      $('phase').textContent = 'no scan';
      $('strip').innerHTML = '';
      return;
    }
    $('phase').textContent = sc.phase;
    $('iter').textContent = `${sc.iteration} / ${sc.max_iterations}`;
    $('sweep').textContent = `${Math.min(sc.sweep_index + 1, sc.sweep_count)} / ${sc.sweep_count}`;
    $('loopstatus').innerHTML = sc.waiting
      ? '<span class="pill warn">WAITING — beam</span>'
      : sc.finished
        ? `<span class="pill ${sc.outcome === 'aborted' ? 'bad' : 'ok'}">${sc.outcome}</span>`
        : '<span class="pill ok">running</span>';
    $('reason').textContent = sc.reason || '—';

    $('qpct').textContent = sc.quality_pct;
    $('qbar').style.width = Math.min(100, sc.quality_pct) + '%';
    $('qtarget').textContent = sc.target_quality_pct + ' %';
    $('qok').textContent = `${sc.quality_ok} / ${sc.quality_low}`;
    $('qacq').textContent = `${sc.acquired} / ${sc.total}`;

    const strip = $('strip');
    const cov = sc.coverage || [];
    if (strip.children.length !== cov.length) {
      strip.innerHTML = cov.map(() => '<div class="tick"></div>').join('');
    }
    cov.forEach((v, i) => { strip.children[i].className = 'tick' + (v ? ' s' + v : ''); });
  } catch (e) { /* transient */ }
}
setInterval(poll, 700); poll();

function logline(cls, text) {
  const el = $('log');
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  el.appendChild(d);
  while (el.children.length > 400) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

const es = new EventSource('/events');
es.onopen = () => $('conn').textContent = 'live';
es.onerror = () => $('conn').textContent = 'reconnecting…';
es.onmessage = ev => {
  let d; try { d = JSON.parse(ev.data); } catch { return; }
  if (d.kind === 'frame') {
    const f = d.frame;
    logline('frame-' + (f.quality_ok ? 'ok' : 'low'),
      `[${String(d.seq).padStart(4,'0')}] frame ${String(f.index).padStart(3)}  ` +
      `${f.angle.toFixed(2).padStart(7)}°  counts=${f.counts.toFixed(0)}  ` +
      `ring=${f.ring_current.toFixed(1)}mA  orbit=${(f.orbit_x>0?'+':'')}${f.orbit_x.toFixed(1)}µm  ` +
      `${f.quality_ok ? 'OK' : 'LOW'}`);
  } else if (d.kind === 'beam_low') { logline('beam', 'beam LOW — shutter closing, acquisition gates');
  } else if (d.kind === 'beam_ok') { logline('beam', 'beam OK — shutter open');
  } else if (d.kind === 'interlock') { logline('interlock', `INTERLOCK — interlocks=${d.interlocks}`);
  } else if (d.kind === 'aborted') { logline('aborted', `ABORTED — ${d.reason}`);
  } else if (d.kind === 'finalized') {
    logline('finalized', `finalized — ${d.outcome} · ${d.frames_acquired}/${d.total} frames · ` +
      `${d.quality_pct}% · ${d.iterations} iteration(s)`);
  }
};
</script>
</body>
</html>
