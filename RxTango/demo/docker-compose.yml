name: storage-ring-sim

networks:
  tango-net:
    name: storage-ring-sim-net
    driver: bridge

volumes:
  tango-db-data:

services:
  tango-db:
    image: artefact.skao.int/ska-tango-images-tango-db:11.8.3
    container_name: storage-ring-sim-db
    platform: linux/x86_64
    restart: unless-stopped
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tango
      MARIADB_USER: tango
      MARIADB_PASSWORD: tango
    volumes:
      - tango-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      start_period: 10s
      interval: 500ms
      timeout: 1s
      retries: 3

  tango-dbds:
    image: artefact.skao.int/ska-tango-images-tango-databaseds:5.26.1
    container_name: storage-ring-sim-dbds
    platform: linux/x86_64
    restart: unless-stopped
    network_mode: host
    environment:
      TANGO_HOST: localhost:10000
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: tango
      MYSQL_PASSWORD: tango
      MYSQL_DATABASE: tango
    depends_on:
      tango-db:
        condition: service_healthy
    entrypoint: Databaseds
    command:
      - "2"
      - -ORBendPoint
      - giop:tcp::10000
    healthcheck:
      test: ["CMD", "sh", "-c", "tango_admin --ping-database || exit 1"]
      start_period: 10s
      start_interval: 500ms
      timeout: 3s
      retries: 3

  storage-ring-init:
    build:
      context: ./cpp
    container_name: storage-ring-sim-init
    network_mode: host
    environment:
      TANGO_HOST: localhost:10000
    depends_on:
      tango-dbds:
        condition: service_healthy
    entrypoint: ["/opt/storage-ring/register-devices.sh"]
    restart: "no"

  storage-ring-sim:
    build:
      context: ./cpp
    container_name: storage-ring-sim-server
    network_mode: host
    environment:
      TANGO_HOST: localhost:10000
    depends_on:
      storage-ring-init:
        condition: service_completed_successfully
    command:
      - demo
      - -ORBendPoint
      - giop:tcp:127.0.0.1:2809
    restart: unless-stopped
