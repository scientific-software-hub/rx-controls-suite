[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxdectris"
version = "0.1.0"
description = "Reactive streams for DECTRIS detectors (SIMPLON API)"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "reactivex>=4.0",
    "httpx>=0.27",
    "pyzmq>=26",
    "cbor2>=5.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/scientific-software-hub/rx-controls-suite"

[tool.hatch.build.targets.wheel]
packages = ["src/rxdectris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
